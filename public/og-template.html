<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>OG Card Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #090d16;
      font-family: 'Cairo', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Ambient Glows */
    .glow-1 {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, rgba(14, 165, 233, 0) 70%);
      border-radius: 50%;
    }
    .glow-2 {
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.22) 0%, rgba(20, 184, 166, 0) 70%);
      border-radius: 50%;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .card-container {
      position: relative;
      z-index: 10;
      width: 1120px;
      height: 550px;
      border-radius: 32px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      padding: 50px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }
    .info-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 16px;
      font-weight: 700;
      width: fit-content;
      margin-bottom: 22px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
    h1 {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subhead {
      font-size: 24px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }
    .tech-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 16px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .url-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #38bdf8;
      font-weight: 600;
    }
    .photo-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .photo-frame {
      width: 290px;
      height: 290px;
      border-radius: 36px;
      padding: 6px;
      background: linear-gradient(135deg, #38bdf8, #14b8a6, rgba(255,255,255,0.1));
      box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.4);
      position: relative;
    }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 30px;
    }
    .stat-chip {
      position: absolute;
      bottom: -16px;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 22px;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid-pattern"></div>

  <div class="card-container">
    <div class="info-side">
      <div class="badge-top">
        <span class="pulse-dot"></span>
        <span>البورتفوليو التفاعلي الرسمي • 2026</span>
      </div>

      <h1>لقمان محمد الهتاري</h1>

      <p class="subhead">
        نظم معلومات إدارية (MIS) • تحليل بيانات • هندسة تطبيقات الويب
      </p>

      <div class="pills-group">
        <div class="tech-pill">📊 SQL Server & Power BI</div>
        <div class="tech-pill">⚛️ React 19 & NestJS</div>
        <div class="tech-pill">🤖 الذكاء الاصطناعي التوليدي</div>
      </div>

      <div class="url-footer">
        <span>🌐</span>
        <span>loqmanalhetari.vercel.app</span>
      </div>
    </div>

    <div class="photo-side">
      <div class="photo-frame">
        <img class="photo-img" src="./loqman.jpg" alt="لقمان محمد الهتاري">
      </div>
      <div class="stat-chip">
        🎓 بكالوريوس نظم معلومات إدارية
      </div>
    </div>
  </div>
</body>
</html>
